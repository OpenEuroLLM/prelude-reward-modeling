# The judges of the preference-labeling stage (collect-preferences/): the three of the pool and the three
# substitutes, in that order. The other candidates of the pilot (Qwen3.5-27B, Command A+ 05-2026, Apertus 1.5 70B,
# Mistral Large 2411) are in the repository README's judge table and are no longer configured here.
#
# Every judge is a strong, multilingual open model that fits one LUMI-G node in bf16 (8 x 64 GB GCDs;
# gfx90a has no FP8 hardware, so only bf16 checkpoints are usable) and whose licence puts no restriction on its
# outputs. Prelude checkpoints are never judges.
#
# Fields
#   hf, revision    Hugging Face repo and the commit the weights were downloaded at. `main` is resolved to a
#                   commit sha by fetch_judges.py (recorded in data/models/<name>/_download_info.json) and
#                   then pinned here.
#   family          model family. A judge never grades a pair that contains an answer from its own family
#                   (self-preference and preference leakage). Responder families: qwen = qwen3.5-9b and
#                   qwen2.5-7b; gemma = gemma-4-12b; mistral = mistral-7b-v0.1 and zephyr-7b-beta (a
#                   Mistral-7B fine-tune). openai and glm have no responders in the pool.
#   convert         the judge is not used as published: convert_judges.py <value> downloads and converts it
#                   (fetch_judges.py skips it).
#   licence         what the licence says about the judge's outputs (our labels).
#   tp              tensor-parallel degree on one node (dense ~30B: 2, so four replicas per node;
#                   100-125B: 8, one replica per node).
#   max_tokens      budget of new tokens per call when it differs from judge.py's default of 16,384 (a call
#                   without a verdict is retried once with twice the budget, capped by the context).
#   thinking        the chat-template switch that turns the native thinking mode on (gpt-oss and Mistral Small
#                   4 take a reasoning effort instead). Every judge runs with it (user, 2026-11-15: "it doesn't
#                   even make sense to use model that support reasoning without reasoning").
#   sampling        decoding in that mode: the vendor's recommendation (Gemma 4 and Qwen model cards, Qwen's
#                   "general tasks" settings; the gpt-oss repository; for GLM the Z.ai API default, as the
#                   GLM-4.5 card gives none; Mistral Small 4's card). Never greedy for a model that reasons:
#                   the first pilot runs were greedy, and a third of their calls without a verdict were
#                   repetition loops. judge.py seeds every call from (pair, order, attempt).
#   vllm            extra engine arguments.
#   env             environment variables judge.py sets before vLLM starts (e.g. allocator settings).
judges:
  - name: gemma-4-31B-it
    hf: google/gemma-4-31B-it
    revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
    family: gemma
    licence: Apache-2.0 (no restriction on outputs; unlike the Gemma 3 terms)
    arch: Gemma4ForConditionalGeneration
    params: 31B dense
    bf16_gb: 63
    tp: 2
    max_model_len: 65536
    thinking: {enable_thinking: true}
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    vllm: {limit_mm_per_prompt: {image: 0, audio: 0}}
    note: >-
      pool judge. MMMLU 88.4, 140+ languages; Gemma 3 27B was the best open MQM translation judge. Pilot
      (round 3): 94.7% agreement with Opus at 0.50 node-hours per 1,000 pairs. Excluded on pairs with a
      Gemma 4 12B answer.

  - name: qwen3.8-27b
    hf: Qwen/Qwen3.8-27B
    revision: 37561816e66b5b9153b1b64c10968c18c1e6f4a0
    family: qwen
    licence: Apache-2.0 (no restriction on outputs)
    arch: Qwen3_5ForConditionalGeneration
    params: 27.8B dense
    bf16_gb: 56
    tp: 2
    max_model_len: 65536
    thinking: {enable_thinking: true}
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0}
    vllm: {limit_mm_per_prompt: {image: 0, video: 0}}
    note: >-
      pool judge. Aug 2026 successor of Qwen3.5-27B with the same architecture; the best agreement with
      Opus in the pilot (95.7%) at 0.91 node-hours per 1,000 pairs. Thinking is on by default at
      reasoning_effort xhigh, the template default, kept. The template implements effort levels by putting its
      own line before the system prompt (xhigh "Reasoning effort is set to xhigh. Please think carefully through
      the task, validate key assumptions, consider plausible alternatives, and prioritize correctness,
      consistency, and clarity in the final answer."), as gpt-oss states its effort in its system header.
      Sampling from the card (the thinking mode has no presence penalty, unlike Qwen3.5). Excluded on pairs
      with a Qwen3.5-9B or Qwen2.5-7B answer.

  - name: gpt-oss-120b-bf16
    hf: unsloth/gpt-oss-120b-BF16
    revision: 859f0c25dc39736936ad8bc7b946095ffd9a4c69
    family: openai
    licence: Apache-2.0 (no restriction on outputs)
    arch: GptOssForCausalLM
    params: 117B total, 5.1B active (MoE)
    bf16_gb: 234
    tp: 8
    max_model_len: 65536
    thinking: {reasoning_effort: high}
    sampling: {temperature: 1.0, top_p: 1.0}
    note: >-
      pool judge, on every pair (no responder of its family). bf16 re-upload of openai/gpt-oss-120b, since
      the native MXFP4 kernels are not available on gfx90a. Pilot (round 3): 93.2% agreement with Opus at
      reasoning effort high (90.2% at medium) at 0.49 node-hours per 1,000 pairs. gpt-oss always reasons; the
      analysis channel counts against the token budget. Its final channel header may carry a <|constrain|>json
      tag, which judge.py's parser accepts.

  - name: qwen3.5-122b-a10b
    hf: Qwen/Qwen3.5-122B-A10B
    revision: dc4d348443bc740c68e2d77492492c11606384d5
    family: qwen
    licence: Apache-2.0 (no restriction on outputs)
    arch: Qwen3_5MoeForConditionalGeneration
    params: 122B total, 10B active (MoE)
    bf16_gb: 250
    tp: 8
    max_model_len: 65536
    thinking: {enable_thinking: true}
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    vllm: {limit_mm_per_prompt: {image: 0, video: 0}}
    note: >-
      first substitute (in place of Gemma on pairs with a Gemma 4 12B answer) and first tie-breaker.
      Strongest multilingual Qwen3.5 that fits one node (MMMLU 86.7, 201 languages). Pilot (round 3): 94.8%
      agreement with Opus at 1.03 node-hours per 1,000 pairs. Sampling from the card (Qwen's "general tasks"
      settings for the thinking mode).

  - name: mistral-small-4-119b
    hf: mistralai/Mistral-Small-4-119B-2603
    revision: a11f36bebf709121056b1dbcc943d1c6afbe494d
    convert: mistral-small-4
    family: mistral
    licence: Apache-2.0 (no restriction on outputs)
    arch: MistralLarge3ForCausalLM (native Mistral format)
    params: 119B total, about 6B active (MLA attention; 128 experts, 4 per token, plus a shared expert)
    bf16_gb: 239
    tp: 8
    max_model_len: 65536
    thinking: {reasoning_effort: high}
    sampling: {temperature: 0.7}
    vllm: {tokenizer_mode: mistral, config_format: mistral, load_format: mistral, limit_mm_per_prompt: {image: 0}}
    note: >-
      second substitute (in place of Qwen3.8 on pairs with a Qwen3.5-9B or Qwen2.5-7B answer, unless the
      other answer is from a Mistral model) and second tie-breaker. Published in FP8 only, which the MI250X
      cannot compute with, and in HF format as a mistral4 model that vLLM 0.26 does not know; convert_judges.py
      dequantises the native checkpoint to bf16, which vLLM loads as MistralLarge3ForCausalLM. Reasoning per
      request (reasoning_effort high), between [THINK] and [/THINK]. Sampling from the card (temperature 0.7
      for reasoning). Pilot (round 3): 89.4% agreement with Opus (English 80.7%), the longer answer in 76% of
      its disagreements with Opus, at 0.87 node-hours per 1,000 pairs. Excluded on pairs with a Mistral-7B or
      Zephyr answer.

  - name: glm-4.5-air
    hf: zai-org/GLM-4.5-Air
    revision: a24ceef6ce4f3536971efe9b778bdaa1bab18daa
    family: glm
    licence: MIT (no restriction on outputs)
    arch: Glm4MoeForCausalLM
    params: 106B total, 12B active (MoE)
    bf16_gb: 221
    tp: 8
    max_model_len: 65536
    thinking: {enable_thinking: true}
    sampling: {temperature: 1.0, top_p: 0.95}
    note: >-
      third substitute (pairs with both a Qwen and a Mistral answer, or a Gemma and a Qwen answer) and
      third tie-breaker; never excluded (no responder of its family). Pilot (round 3): 88.0% agreement with
      Opus, leaning to longer answers, at 0.65 node-hours per 1,000 pairs. Often answers inside an unclosed
      think block, which judge.py's parser accepts when the output stops right after the JSON object.
