# Model pool for sampling responses to the 128k prompt set (data/compiled/prompts.jsonl).
#
# Groups
#   prelude  Prelude 9B post-trained checkpoints: on-policy responses for the policy the RM will train
#   strong   recent (2025-12 .. 2026-05), good ~9B models
#   mid      older or weaker-than-Prelude models in between
#   weak     old (2023-24), relatively bad 7B models
#
# Every model is pinned to a commit and fetched to data/models/<name>/ by fetch_pool.py.
# Fields
#   name            local directory and the label stored with each response
#   hf, revision    Hugging Face repo and pinned commit
#   released        first public release (YYYY-MM)
#   params_b        parameters in billions (multimodal models: including the vision/audio encoder)
#   max_model_len   context used for sampling (131,072 for the long-context models, else the native limit);
#                   assign.py gives a prompt to a model and mode only if the rendered prompt leaves room for at
#                   least 2,048 new tokens (8,192 when thinking), and the budget is capped to what fits
#   modes           the answer modes the model was trained for, with their chat-template arguments:
#                     direct  answer at once
#                     think   reasoning first; `think_end` is the token that closes the reasoning
#                   A model with both modes answers each prompt in one of them, chosen at random (50/50).
#                   The reasoning is stored apart from the answer.
#   system          native: the template takes a system message
#                   merge:  the template rejects or drops it; prepend it to the first user turn
#   default_system  the template injects its own identity ("You are Qwen, created by Alibaba Cloud. You are a
#                   helpful assistant.") when the prompt has no system message. This is that prompt with the
#                   identity changed to Prelude (OpenEuroLLM); everything else in it is kept. It is passed as the
#                   system message whenever the prompt has none, so the template's own text is never used.
#                   smoke_test.py templates checks that no template frame names another model or maker.
#   sampling        vLLM SamplingParams: temperature 1.0 and nothing else (top-p 1.0, no top-k, no penalties)
#                   for every model. `source` records what the authors recommend instead. Bad answers are
#                   wanted: the data trains a reward model.
#   weight          relative probability of being drawn for a response (assign.py): 1.0, or 0.5 / 0.25 for models
#                   whose answers are word salad in >= 10% / >= 25% of the smoke test's general prompts at
#                   temperature 1.0 (smoke_compare.py --weights, data/responses/smoke/WEIGHTS.txt)
#   vllm            extra engine arguments
#   notes           lineage, evaluations, caveats

defaults:
  sampling: {temperature: 1.0, top_p: 1.0}
  # new-token budgets, capped by max_model_len. The first pass (sample.py, 2026-11-14) ran with 4,096 / 16,384 and
  # capped the four weak models at 2,048 although their contexts allow more; continue_truncated.py (2026-11-15)
  # continued every response that hit those budgets up to these, so the data is as if sampled with them.
  max_new_tokens: {direct: 16384, think: 32768}
  system: native

models:

# ---------------------------------------------------------------- prelude (on-policy)
# All are Qwen3-architecture 9B checkpoints of OpenEuroLLM Prelude-base (10T tokens, ~20% in the
# 36 OpenEuroLLM languages, i.e. our 38 language codes), from four post-training lines:
#   A  birgermoell / Neonkraft on oellm-9b-256k-theta64m-prelude-anneal300b (263,168 vocab)
#   B  OpenEuroLLM Excellent-SFT (openeurollm/post-training)
#   C  marianna13 mid-train (128k) + reasoning SFT
#   D  first OpenEuroLLM SFT experiment on the pre-anneal base
# EUROPA = BirgerMoell/europa-eval (432 items, 36 European languages, judged by Gemma-4-31B,
# direct mode, greedy); "Alignment" = europa-alignment. Figures from the model cards.

- name: prelude-w2-rl
  hf: birgermoell/oellm-9b-256k-stage5-w2-rl-step160
  revision: f93dc0d21a5035ed7fee40ab70fb1afb7cf02203
  group: prelude
  released: 2026-10
  license: apache-2.0
  params_b: 9.1
  max_model_len: 131072
  modes:
    direct: {template_kwargs: {enable_thinking: false}}
    think: {template_kwargs: {enable_thinking: true}, think_end: "</think>"}
  weight: 1.0           # word salad in 5% of smoke answers at temperature 1.0
  sampling: {source: "none given (the cards report greedy evaluations)"}
  notes: >-
    Line A, recommended general checkpoint: instruct SFT -> reasoning SFT -> tool SFT -> DPO ->
    merge -> RL W1a -> RL W2 (DAPO). EUROPA 0.727, Alignment 0.717. Thinking mode is the more
    accurate one for maths; 86% of its traces close within 6K tokens.

