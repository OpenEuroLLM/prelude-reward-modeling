    licence: Apache-2.0
    note: harm and refusal labels per response (119 languages); sees the full thinking trace.
  - name: glotlid
    hf: cis-lmu/glotlid
    revision: e9592e0a9bc3b6f2a946de94faaa188d1dd6f522
    allow: ["model_v3.bin"]
    licence: Apache-2.0 (model); labels cover all 38 of our languages including Latgalian
